<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090C12" />
  <title>Refresh Wizard Apps</title>
  <style>
    :root { color-scheme:dark; --bg:#090c12; --surface:#151924; --line:#252c3d; --text:#f3f6fb; --muted:#8f98ad; --teal:#005d66; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:24px; }
    main { width:min(520px,100%); border:1px solid var(--line); border-radius:28px; background:var(--surface); padding:26px; box-shadow:0 30px 90px rgba(0,0,0,.45); }
    h1 { margin:0 0 12px; font-size:1.6rem; letter-spacing:-.04em; }
    p { margin:0 0 18px; color:var(--muted); line-height:1.45; }
    button,a { width:100%; min-height:54px; display:flex; align-items:center; justify-content:center; border-radius:17px; text-decoration:none; font:inherit; font-weight:800; }
    button { border:1px solid #086b76; background:var(--teal); color:#f1feff; cursor:pointer; }
    a { margin-top:10px; border:1px solid var(--line); color:#e8edf7; background:#172030; }
    pre { white-space:pre-wrap; color:#aab3c6; font-size:.82rem; line-height:1.35; margin:16px 0 0; }
  </style>
</head>
<body>
  <main>
    <h1>Refresh Wizard Apps</h1>
    <p>This clears browser-side app caches and reloads the latest Wizard Apps Manager shell.</p>
    <button id="clearBtn" type="button">Clear app cache and reload</button>
    <a id="openBtn" href="/apps/?hard_refresh=1">Open without clearing</a>
    <pre id="status">Ready.</pre>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    function log(line) { statusEl.textContent += `\n${line}`; }
    async function hardRefresh(auto = false) {
      statusEl.textContent = 'Clearing caches…';
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map(key => caches.delete(key)));
          log(`Deleted ${keys.length} CacheStorage entr${keys.length === 1 ? 'y' : 'ies'}.`);
        } else {
          log('CacheStorage not available.');
        }
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          await Promise.all(regs.map(reg => reg.unregister()));
          log(`Unregistered ${regs.length} service worker${regs.length === 1 ? '' : 's'}.`);
        } else {
          log('Service workers not available.');
        }
        try { localStorage.setItem('appsManagerHardRefreshAt', String(Date.now())); } catch {}
        const next = `/apps/?hard_refresh=${Date.now()}`;
        log(`Opening ${next}`);
        window.location.replace(next);
      } catch (err) {
        log(`Failed: ${err && err.message ? err.message : err}`);
        if (auto) window.location.replace(`/apps/?hard_refresh=${Date.now()}`);
      }
    }
    document.getElementById('clearBtn').addEventListener('click', () => hardRefresh(false));
    if (new URL(location.href).searchParams.get('auto') === '1') hardRefresh(true);
  </script>
</body>
</html>
